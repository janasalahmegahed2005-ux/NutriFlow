<div class="login-page">

  <!-- =====================================================
       LOGIN CARD
       ===================================================== -->

  <div class="login-card">

    <div class="brand">

      <h1>NutriFlow</h1>

      <p>
        Personalized Nutrition & Wellness
      </p>

    </div>


    <h2>
      Welcome Back
    </h2>


    <p class="subtitle">
      Login to continue your wellness journey
    </p>


    <form (ngSubmit)="onLogin()">

      <!-- Email OR Username -->

      <div class="form-group">

        <label for="identifier">
          Email or Username
        </label>

        <input
          id="identifier"
          type="text"
          placeholder="Enter your email or username"
          [(ngModel)]="identifier"
          name="identifier"
          autocomplete="username"
          required
        />

      </div>


      <!-- Password -->

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
          required
        />

      </div>


      <!-- Login Button -->

      <button
        type="submit"
        [disabled]="isLoading"
      >

        {{ isLoading ? 'Logging in...' : 'Login' }}

      </button>

    </form>


    <!-- Register Link -->

    <p class="register-link">

      Don't have an account?

      <a routerLink="/register">
        Create an account
      </a>

    </p>

  </div>

</div>
